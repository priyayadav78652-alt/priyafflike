<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>Instagram Media Extractor</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f9;--text:#171923;--muted:#707585;--card:rgba(255,255,255,.72);--line:rgba(90,98,120,.16);--accent:#6257e8;--accent2:#9187ff;--green:#168454;--shadow:0 18px 55px rgba(36,40,70,.10);--field:rgba(255,255,255,.72)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0c10;--text:#f4f5fb;--muted:#a0a5b5;--card:rgba(27,29,38,.76);--line:rgba(210,215,240,.13);--accent:#a39aff;--accent2:#7469e9;--green:#61d6a0;--shadow:0 18px 55px rgba(0,0,0,.30);--field:rgba(255,255,255,.045)}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,rgba(119,105,255,.13),transparent 36%),radial-gradient(ellipse at 100% 40%,rgba(67,180,220,.10),transparent 32%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh;padding:28px 16px 22px}
main{max-width:780px;margin:0 auto}.glass{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:25px}.panel{padding:20px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--field);border:1px solid var(--line);border-radius:15px;padding:5px;margin-bottom:17px}.tab{border:0;border-radius:11px;padding:11px 8px;color:var(--muted);background:transparent;font-weight:650;cursor:pointer}.tab.active{background:var(--card);color:var(--text);box-shadow:0 2px 9px rgba(0,0,0,.08)}.inputrow{display:flex;gap:9px}.input{min-width:0;flex:1;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px 15px;color:var(--text);outline:none;font:inherit}.input:focus{border-color:var(--accent)}button{font:inherit}.primary{border:0;border-radius:14px;padding:0 19px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:700;cursor:pointer;box-shadow:0 7px 18px rgba(98,87,232,.22)}button:disabled{opacity:.6;cursor:wait}.hint{color:var(--muted);font-size:12px;margin:10px 2px 0}.statusline{display:flex;justify-content:center;margin:17px 0 0;min-height:28px}.status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted)}.status.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent)}.spinner{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}.results{margin-top:18px;display:grid;gap:14px}.summary{padding:17px}.profile{display:flex;gap:12px;align-items:center;min-width:0}.avatar{width:49px;height:49px;border-radius:50%;object-fit:cover;background:var(--field);border:1px solid var(--line);flex-shrink:0}.username{font-weight:750;overflow-wrap:anywhere}.caption{color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.chip{font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--muted)}.media-card{overflow:hidden}.preview{position:relative;background:#08090d;display:flex;align-items:center;justify-content:center;min-height:150px;max-height:560px}.preview img,.preview video{display:block;width:100%;max-height:560px;object-fit:contain}.preview video{background:#08090d}.playhint{position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(15,15,20,.55);border:1px solid rgba(255,255,255,.45);color:white;pointer-events:none;backdrop-filter:blur(8px);font-size:21px;padding-left:3px}.media-body{padding:14px}.media-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700}.type-tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:3px 7px}.urlbox{border:1px solid var(--line);border-radius:11px;background:var(--field);padding:9px 10px;font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;color:var(--muted);margin-bottom:10px}.urltext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.urltext.full{display:block;overflow-wrap:anywhere}.urltoggle{border:0;background:none;color:var(--accent);font-size:11px;padding:5px 0 0;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:11px;padding:10px 8px;font-size:12px;font-weight:650;cursor:pointer;text-align:center;text-decoration:none}.action.download{grid-column:1/-1;background:var(--accent);border-color:transparent;color:#fff}.errorbox{padding:16px;border:1px solid rgba(220,70,70,.25);border-radius:15px;background:var(--card);color:var(--muted);font-size:13px}.footer{margin-top:24px;text-align:center;color:var(--muted);font-size:11px}.footbuttons{display:flex;justify-content:center;gap:8px;margin-bottom:12px}.footbuttons button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 14px;font-size:11px;font-weight:650;cursor:pointer}.credit{margin-top:4px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);transition:.22s;z-index:20;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.modalback{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(15,17,28,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.modal{width:min(100%,560px);max-height:min(82vh,700px);overflow:auto;padding:21px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 28px 100px rgba(0,0,0,.25)}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.modalhead h2{font-size:18px;margin:0}.close{border:1px solid var(--line);background:var(--field);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer}.modaltext{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.modalpre{font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--field);border:1px solid var(--line);border-radius:13px;padding:13px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.modalactions .action{padding:9px 15px}.notice{font-size:11px;color:var(--muted);margin-top:12px}
@media(min-width:600px){body{padding-top:48px}.panel{padding:25px}.summary{padding:21px}.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.media-card{min-width:0}.preview{min-height:190px}}
@media(max-width:420px){body{padding:15px 10px}.panel{padding:14px}.inputrow{flex-direction:column}.primary{padding:13px}.input{width:100%}.summary{padding:14px}.profile{align-items:flex-start}.actions{gap:7px}}
</style>
</head>
<body>
<main>
  <section class="glass panel">
    <div class="tabs" role="tablist" aria-label="URL type">
      <button class="tab active" data-mode="ig" role="tab" aria-selected="true">Instagram URL</button>
      <button class="tab" data-mode="cdn" role="tab" aria-selected="false">Paste CDN URL</button>
    </div>
    <form id="extractForm">
      <div class="inputrow">
        <input id="urlInput" class="input" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste Instagram post or reel URL" aria-label="URL">
        <button id="extractBtn" class="primary" type="submit">Extract</button>
      </div>
    </form>
    <div class="hint" id="hint">Paste a public Instagram post, reel, or image URL.</div>
    <div class="statusline"><span id="status" class="status hidden" aria-live="polite"></span></div>
  </section>
  <section id="results" class="results hidden" aria-live="polite"></section>
  <footer class="footer">
    <div class="footbuttons">
      <button type="button" id="docsBtn">Docs</button>
      <button type="button" id="promptBtn">Prompt</button>
    </div>
    <div>Copyright © Growfansite 2026</div>
    <div class="credit">Credit @Growfansite</div>
  </footer>
</main>
<div id="toast" class="toast" role="status"></div>
<div id="modalBack" class="modalback hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modalhead"><h2 id="modalTitle">Details</h2><button class="close" id="closeModal" aria-label="Close">×</button></div>
    <div id="modalContent"></div>
    <div class="modalactions"><button class="action" id="modalCopy">Copy</button><button class="action" id="modalDone">Done</button></div>
  </div>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const input = $('#urlInput'), form = $('#extractForm'), btn = $('#extractBtn');
  const status = $('#status'), results = $('#results'), hint = $('#hint');
  let mode = 'ig', toastTimer, modalCopyText = '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300)}
  async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copied to clipboard')}catch(e){try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok)toast('Copied to clipboard');else toast('Copy failed')}catch(_){toast('Copy failed')}}}
  function setStatus(kind, text){status.className='status'+(kind==='done'?' done':'');status.innerHTML=(kind==='loading'?'<span class="spinner"></span>':'')+esc(text);status.classList.remove('hidden')}
  function setLoading(v){btn.disabled=v;btn.textContent=v?'Working…':'Extract'}
  function isHttpUrl(s){try{const u=new URL(s);return u.protocol==='http:'||u.protocol==='https:'}catch(e){return false}}
  function normalizeMedia(data){
    let raw = Array.isArray(data?.media) ? data.media : [];
    if(!raw.length && data?.data) raw = Array.isArray(data.data) ? data.data : (Array.isArray(data.data.media) ? data.data.media : []);
    const out = raw.map(x=>({type:String(x.type|| (x.video_url?'video':x.display_url?'image':'image')).toLowerCase()==='video'?'video':'image',cdn_url:x.cdn_url||x.video_url||x.display_url||x.url||'',download_url:x.download_url||x.cdn_url||x.video_url||x.display_url||x.url||''})).filter(x=>isHttpUrl(x.cdn_url));
    return {success:data?.success!==false && out.length>0,type:data?.type||'',media:out,meta:data?.meta||data?.metadata||{username:data?.username,description:data?.description,thumbnail_url:data?.thumbnail_url,likes:data?.likes}};
  }
  async function fetchJson(url, timeout=15000){
    const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),timeout);
    try{const r=await fetch(url,{signal:controller.signal,headers:{'Accept':'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}
  }
  async function tryApi(igUrl){
    const endpoint='https://ig-dl-api.vercel.app/api/igdl?url='+encodeURIComponent(igUrl);
    const d=await fetchJson(endpoint,18000), n=normalizeMedia(d);
    if(n.success) return n;
    throw Error('No media returned');
  }
  async function relayExtract(igUrl){
    const targets=[
      'https://api.allorigins.win/raw?url='+encodeURIComponent(igUrl),
      'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(igUrl)
    ];
    for(const relay of targets){
      try{
        const r=await fetch(relay,{headers:{'Accept':'text/html,application/json'},signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined});
        if(!r.ok)continue;
        const text=await r.text();
        let html=text;
        try{const j=JSON.parse(text);html=j.contents||j.html||text}catch(_){}
        const vids=[...html.matchAll(/["'](?:video_url|videoUrl)["']\s*:\s*["']([^"']+)["']/g)].map(m=>m[1].replace(/\\u0026/g,'&').replace(/\\\//g,'/'));
        const imgs=[...html.matchAll(/["'](?:display_url|displayUrl|og:image)["']\s*:\s*["']([^"']+)["']/g)].map(m=>m[1].replace(/\\u0026/g,'&').replace(/\\\//g,'/'));
        const media=[...new Set(vids)].filter(isHttpUrl).map(cdn_url=>({type:'video',cdn_url,download_url:cdn_url}));
        for(const cdn_url of [...new Set(imgs)].filter(isHttpUrl)) if(!media.some(x=>x.cdn_url===cdn_url))media.push({type:'image',cdn_url,download_url:cdn_url});
        if(media.length)return {success:true,type:media.some(x=>x.type==='video')?'mixed':'image',media,meta:{username:'',description:'',thumbnail_url:media.find(x=>x.type==='image')?.cdn_url||'',likes:null}};
      }catch(_){}
    }
    throw Error('Relay extraction failed');
  }
  async function microlinkImage(igUrl){
    try{
      const d=await fetchJson('https://api.microlink.io/?url='+encodeURIComponent(igUrl)+'&data=image.url,video.url,title,description',14000);
      const image=d?.data?.image?.url;
      if(image&&isHttpUrl(image))return {success:true,type:'image',media:[{type:'image',cdn_url:image,download_url:image}],meta:{username:'',description:d.data.description||d.data.title||'',thumbnail_url:image,likes:null}};
    }catch(_){}
    return null;
  }
  async function extract(igUrl){
    let firstError;
    try{return await tryApi(igUrl)}catch(e){firstError=e}
    try{return await relayExtract(igUrl)}catch(_){}
    const mic=await microlinkImage(igUrl);if(mic)return mic;
    throw firstError||Error('Could not extract media');
  }
  function formatLikes(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?n.toLocaleString():String(v)}
  function safeHost(url){try{return new URL(url).hostname}catch(e){return 'media URL'}}
  function renderSummary(data){
    const m=data.meta||{}, videos=data.media.filter(x=>x.type==='video').length, images=data.media.filter(x=>x.type==='image').length;
    const username=m.username?('@'+String(m.username).replace(/^@/,'')):'Instagram media';
    const avatar=m.thumbnail_url&&isHttpUrl(m.thumbnail_url)?m.thumbnail_url:'';
    const likes=formatLikes(m.likes);
    return `<section class="glass summary"><div class="profile"><img class="avatar" alt="" referrerpolicy="no-referrer" src="${esc(avatar)}" onerror="this.style.visibility='hidden'"><div style="min-width:0"><div class="username">${esc(username)}</div><div class="caption">${esc(m.description||'Media extracted successfully.')}</div></div></div><div class="chips"><span class="chip">${videos} video${videos===1?'':'s'}</span><span class="chip">${images} image${images===1?'':'s'}</span><span class="chip">${esc(data.type|| (videos&&images?'mixed':videos?'video':'image'))}</span>${likes!==null?`<span class="chip">♥ ${esc(likes)} likes</span>`:''}</div></section>`;
  }
  function mediaCard(item,index){
    const url=item.cdn_url, download=item.download_url||url, isVideo=item.type==='video';
    const preview=isVideo
      ? `<video class="videoEl" controls playsinline preload="metadata" src="${esc(url)}" crossorigin="anonymous" aria-label="Video preview"></video><span class="playhint" aria-hidden="true">▶</span>`
      : `<img class="imageEl" src="${esc(url)}" alt="Instagram image ${index+1}" referrerpolicy="no-referrer" loading="lazy">`;
    return `<article class="glass media-card" data-index="${index}"><div class="preview">${preview}</div><div class="media-body"><div class="media-top"><span>${isVideo?'Video':'Image'} ${index+1}</span><span class="type-tag">${esc(safeHost(url))}</span></div><div class="urlbox"><div class="urltext" id="urltext-${index}">${esc(url)}</div><button class="urltoggle" data-action="toggle" data-index="${index}">Show full URL</button></div><div class="actions"><a class="action download" href="${esc(download)}" target="_blank" rel="noopener noreferrer" download>↓ &nbsp; Download</a><button class="action" data-action="copy" data-index="${index}">Copy URL</button><a class="action" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open URL ↗</a></div></div></article>`;
  }
  function proxyImageUrl(url){return 'https://images.weserv.nl/?url='+encodeURIComponent(url.replace(/^https?:\/\//,''))}
  function attachFallbacks(data){
    results.querySelectorAll('.videoEl').forEach((video)=>{
      const original=video.getAttribute('src');let triedBlob=false;
      video.addEventListener('error',async()=>{
        if(triedBlob)return;triedBlob=true;
        try{
          const response=await fetch(original,{mode:'cors',cache:'no-store'});
          if(!response.ok)throw Error('fetch failed');
          const blob=await response.blob();
          if(!blob.type.startsWith('video/'))throw Error('not video');
          video.src=URL.createObjectURL(blob);video.load();
          const overlay=video.parentElement.querySelector('.playhint');if(overlay)overlay.remove();
        }catch(_){const overlay=video.parentElement.querySelector('.playhint');if(overlay)overlay.remove();video.insertAdjacentHTML('afterend','<div style="position:absolute;bottom:8px;left:8px;right:8px;color:white;background:#181922d9;border-radius:8px;padding:8px;font-size:11px;text-align:center">Preview unavailable in this browser. Use Download or Open URL.</div>')}
      });
      video.addEventListener('play',()=>{const overlay=video.parentElement.querySelector('.playhint');if(overlay)overlay.remove()},{once:true});
      video.addEventListener('loadeddata',()=>{const overlay=video.parentElement.querySelector('.playhint');if(overlay)overlay.remove()},{once:true});
    });
    results.querySelectorAll('.imageEl').forEach((img)=>{
      let stage=0;const original=img.src;const item=data.media[Number(img.closest('.media-card').dataset.index)];
      img.addEventListener('error',()=>{
        stage++;
        if(stage===1 && item.download_url && item.download_url!==original){img.src=item.download_url;return}
        if(stage<=2){img.referrerPolicy='no-referrer';img.src=proxyImageUrl(original);return}
        img.replaceWith(Object.assign(document.createElement('div'),{textContent:'Image preview unavailable. Try Download or Open URL.',style:'color:white;padding:24px;text-align:center;font-size:12px'}));
      });
    });
  }
  function render(data){
    const videos=data.media.filter(x=>x.type==='video').length, images=data.media.filter(x=>x.type==='image').length;
    results.innerHTML=renderSummary(data)+'<div class="media-grid">'+data.media.map(mediaCard).join('')+'</div>';
    results.classList.remove('hidden');attachFallbacks(data);
    setStatus('done',`Done — ${videos} video(s), ${images} image(s)`);
  }
  function validateInstagram(url){return isHttpUrl(url)&&/(^|\.)instagram\.com$/i.test(new URL(url).hostname)}
  form.addEventListener('submit',async e=>{
    e.preventDefault();const value=input.value.trim();
    if(!value){toast('Paste a URL first');input.focus();return}
    if(!isHttpUrl(value)){toast('Please enter a valid http(s) URL');return}
    setLoading(true);results.classList.add('hidden');results.innerHTML='';setStatus('loading',mode==='ig'?'Extracting…':'Loading CDN media…');
    try{
      if(mode==='cdn'){
        const kind=/\.(mp4|m3u8|mov)(\?|$)/i.test(value)?'video':'image';
        render({success:true,type:kind,media:[{type:kind,cdn_url:value,download_url:value}],meta:{username:'Direct CDN URL',description:'Preview and download the pasted direct media URL.',thumbnail_url:kind==='image'?value:'',likes:null}});
      }else{
        if(!validateInstagram(value)){throw Error('Enter a valid instagram.com post, reel, or image URL.')}
        const data=await extract(value);render(data);
      }
    }catch(err){results.innerHTML=`<div class="errorbox">Could not extract media from this URL. The post may be private, unavailable, or blocked by the source. Please try a public post or paste a direct CDN URL instead.</div>`;results.classList.remove('hidden');setStatus('error','Could not extract media');}
    finally{setLoading(false)}
  });
  document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
    mode=tab.dataset.mode;document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t===tab);t.setAttribute('aria-selected',String(t===tab))});
    input.value='';input.placeholder=mode==='ig'?'Paste Instagram post or reel URL':'Paste direct CDN image or video URL';
    hint.textContent=mode==='ig'?'Paste a public Instagram post, reel, or image URL.':'Paste a direct media CDN URL to preview or download it.';
    results.classList.add('hidden');status.classList.add('hidden');input.focus();
  }));
  results.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;
    const index=Number(b.dataset.index), item=window.currentMedia?.[index];
    if(b.dataset.action==='toggle'){const el=$('#urltext-'+index);const full=el.classList.toggle('full');b.textContent=full?'Hide full URL':'Show full URL'}
    if(b.dataset.action==='copy'&&item)copyText(item.cdn_url);
  });
  const originalRender=render;
  render=function(data){window.currentMedia=data.media;originalRender(data)};
  const promptText=`Build a premium, mobile-first, single-file HTML Instagram media URL extractor with glassmorphism and Apple-style design, auto light/dark theme, and no external dependencies. Include tabs for Instagram URL and Paste CDN URL; call GET https://ig-dl-api.vercel.app/api/igdl?url={encoded_ig_url}; handle response {success,type,media:[{type:"video"|"image",cdn_url,download_url}],meta:{username,description,thumbnail_url,likes}}. Show summary avatar, username, caption and count/type/likes chips. Video previews use cdn_url with HTML5 video and blob fallback; image previews use referrerpolicy=no-referrer with download_url then images.weserv.nl fallback. Each media item needs a truncated direct URL with Show full URL toggle and Download, Copy, Open buttons. If API fails, silently try AllOrigins/Codetabs relay parsing video_url/display_url, then Microlink for image only. Show status spinner Extracting… and Done — X video(s), Y image(s). Footer has Docs and Prompt modals with Copy buttons, Copyright © Growfansite 2026 and Credit @Growfansite. No header/logo, no prefilled input, Enter submits, copy toast, responsive layout. All CSS and JS inline.`;
  function openModal(title,content,copyTextValue,pre=false){
    $('#modalTitle').textContent=title;$('#modalContent').innerHTML=pre?`<div class="modalpre">${esc(content)}</div>`:`<div class="modaltext">${content}</div>`;
    modalCopyText=copyTextValue;$('#modalBack').classList.remove('hidden');
  }
  const docsText='API endpoint:\nGET https://ig-dl-api.vercel.app/api/igdl?url={encoded_ig_url}\n\nExample response:\n{\n  "success": true,\n  "type": "video",\n  "media": [{"type":"video","cdn_url":"https://…","download_url":"https://…"}],\n  "meta": {"username":"example","description":"Caption","thumbnail_url":"https://…","likes":123}\n}\n\nNotes: Works best with public posts. CDN preview and downloads depend on the remote host, browser CORS, and Instagram availability. Use download_url for downloading; do not assume it can be embedded.';
  $('#docsBtn').addEventListener('click',()=>openModal('API Docs',docsText,docsText,true));
  $('#promptBtn').addEventListener('click',()=>openModal('AI Prompt',promptText,promptText,true));
  $('#closeModal').addEventListener('click',()=>$('#modalBack').classList.add('hidden'));
  $('#modalDone').addEventListener('click',()=>$('#modalBack').classList.add('hidden'));
  $('#modalCopy').addEventListener('click',()=>copyText(modalCopyText));
  $('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))$('#modalBack').classList.add('hidden')});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalBack').classList.add('hidden')});
})();
</script>
</body>
</html>
